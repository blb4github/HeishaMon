name: Integrate extra GPIO (one-time)
on:
  push:
    branches:
      - feature/integrate-extra-gpio
permissions:
  contents: write
jobs:
  squash-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate GPIO source without changing CI workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags https://github.com/IgorYbema/HeishaMon.git feature/configurable-extra-gpio
          test "$(git rev-parse FETCH_HEAD)" = "1149ef1656f8df65740d53278920e1ae159d614b"
          if ! git merge --squash FETCH_HEAD; then
            echo "::error::GPIO merge needs manual conflict resolution"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git restore --source=HEAD --staged --worktree .github/workflows
          git rm .github/workflows/gpio-integration.yml
          git diff --cached --stat
          git commit -m "Integrate configurable GPIO from IgorYbema/HeishaMon 1149ef1" -m "Squash of upstream GPIO work onto official heishamon main. Original authorship and history: https://github.com/IgorYbema/HeishaMon/tree/feature/configurable-extra-gpio. ESP8266 and ESP32-S3 firmware compiled successfully in Actions run 39235002705."
          git push origin HEAD:feature/integrate-extra-gpio
