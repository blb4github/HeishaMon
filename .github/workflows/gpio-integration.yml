name: Integrate extra GPIO (one-time)
on:
  push:
    branches:
      - feature/integrate-extra-gpio
permissions:
  contents: write
jobs:
  merge-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS: "http://arduino.esp8266.com/stable/package_esp8266com_index.json https://espressif.github.io/arduino-esp32/package_esp32_dev_index.json"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge original configurable GPIO implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags https://github.com/IgorYbema/HeishaMon.git feature/configurable-extra-gpio
          test "$(git rev-parse FETCH_HEAD)" = "1149ef1656f8df65740d53278920e1ae159d614b"
          if ! git merge --no-commit --no-ff FETCH_HEAD; then
            echo "::error::Merge conflicts need manual resolution"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git rm .github/workflows/gpio-integration.yml
          git commit -m "Integrate IgorYbema configurable extra GPIO branch (1149ef1)"
      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install platforms and dependencies
        run: |
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli lib install ringbuffer pubsubclient arduinojson dallastemperature onewire "Adafruit NeoPixel"
      - name: Compile ESP8266
        run: |
          cd HeishaMon
          arduino-cli compile --output-dir . --fqbn=esp8266:esp8266:d1_mini:xtal=160,vt=flash,ssl=basic,mmu=3216,non32xfer=fast,eesz=4M2M,ip=lm2f,dbg=Disabled,lvl=None____,wipe=none,baud=921600 --warnings=none HeishaMon.ino
          mv HeishaMon.ino.bin HeishaMon_ESP8266-GPIO-integration.bin
      - name: Compile ESP32-S3 Large
        run: |
          cd HeishaMon
          arduino-cli compile --output-dir . --fqbn=esp32:esp32:esp32s3:CDCOnBoot=cdc,PSRAM=enabled,PartitionScheme=min_spiffs --warnings=none HeishaMon.ino
          mv HeishaMon.ino.bin HeishaMon_ESP32-GPIO-integration.bin
      - name: Upload test firmware
        uses: actions/upload-artifact@v4
        with:
          name: HeishaMon-GPIO-integration-test
          path: HeishaMon/HeishaMon_*-GPIO-integration.bin
      - name: Publish tested code to integration branch
        run: git push origin HEAD:feature/integrate-extra-gpio
